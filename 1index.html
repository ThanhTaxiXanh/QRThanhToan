<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a8f5b">
<link rel="manifest" href="manifest.webmanifest">
<title>Thanh Taxi Xanh — VietQR LAN Display</title>
<style>
:root{--g:#0a8f5b;--bg:#f2f2f7;--c:#fff;--t:#111;--m:#6b6b72}
@media(prefers-color-scheme:dark){:root{--bg:#000;--c:#1c1c1e;--t:#f5f5f7;--m:#9a9aa0}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.w{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:12px}
.card{background:var(--c);border-radius:18px;padding:16px}
h1{font-size:20px;margin:0 0 6px;color:var(--g)}
h2{font-size:15px;margin:0 0 8px}
input,select,textarea,button{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid #8884;background:var(--bg);color:var(--t);margin:4px 0}
button{background:var(--g);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{background:#8883;color:var(--t)}
textarea{min-height:90px;font:12px monospace;word-break:break-all}
summary{cursor:pointer;font-weight:600}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#8883}
.ok{background:#0a8f5b33;color:var(--g)}.bad{background:#ff3b3033;color:#ff3b30}
.qr{text-align:center}
canvas{image-rendering:pixelated;max-width:100%;background:#fff;border-radius:10px}
.amt{font-size:28px;font-weight:700}
.msg{color:#ff3b30;font-size:14px;margin:4px 0}
#stage{min-height:100vh;display:grid;place-items:center;text-align:center;padding:4vmin;background:#fff;color:#111}
#stage .card{background:#f2f2f7;color:#111;text-align:left;max-width:520px}
.hide .ui{display:none!important}
.qb{display:grid;gap:12px;justify-items:center;width:100%}
.qc{width:max-content;max-width:100%;border-radius:28px;background:linear-gradient(#e8eef9,#fff 45%);color:#111;box-shadow:0 8px 30px #2a4a8a24;overflow:hidden;text-align:center}
.qh{padding:16px 20px 12px;border-bottom:2px dashed #0002}
.qa{font-size:clamp(16px,3.4vmin,22px);letter-spacing:.18em;color:#333}
.qn{font-weight:700;letter-spacing:.14em;font-size:clamp(15px,3vmin,20px)}
.qc canvas{display:block;margin:16px 20px 8px}
.qc img{display:block;margin:4px auto 16px;height:clamp(44px,9vmin,70px);mix-blend-mode:multiply}
.qi{width:calc(var(--cw,300px) - 40px);border-radius:24px;background:#fff;color:#111;padding:14px;text-align:center;box-shadow:0 4px 18px #0001}
.qi b{display:block;font-size:clamp(22px,5vmin,34px)}
.qi span{color:#666;font-size:15px}
.code{font-size:44px;font-weight:700;letter-spacing:.12em;margin:4px 0}
</style></head><body><div id="root"></div>

/* ---------- VietQRCore ---------- */
const VietQR=(()=>{
 const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;
 const crc16=s=>{let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};

 const build=({bin,accountNumber,amount,description})=>{
  const b=String(bin||'').replace(/\D/g,''),acc=String(accountNumber||'').replace(/\s/g,''),amt=String(amount||'').replace(/\D/g,'').replace(/^0+/,''),d=clean(description);
  if(!/^\d{6}$/.test(b)||!acc)fail('TXQR_E005');
