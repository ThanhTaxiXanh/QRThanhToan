<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a8f5b">
<link rel="manifest" href="manifest.webmanifest">
<title>Thanh Taxi Xanh — VietQR LAN Display</title>
<style>
:root{--g:#0a8f5b;--bg:#f2f2f7;--c:#fff;--t:#111;--m:#6b6b72}
@media(prefers-color-scheme:dark){:root{--bg:#000;--c:#1c1c1e;--t:#f5f5f7;--m:#9a9aa0}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.w{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:12px}
.card{background:var(--c);border-radius:18px;padding:16px}
h1{font-size:20px;margin:0 0 6px;color:var(--g)}

.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}

.ok{background:#0a8f5b33;color:var(--g)}.bad{background:#ff3b3033;color:#ff3b30}
.qr{text-align:center}
canvas{image-rendering:pixelated;max-width:100%;background:#fff;border-radius:10px}
.amt{font-size:28px;font-weight:700}
.msg{color:#ff3b30;font-size:14px;margin:4px 0}
#stage{min-height:100vh;display:grid;place-items:center;text-align:center;padding:4vmin;background:#fff;color:#111}
#stage .card{background:#f2f2f7;color:#111;text-align:left;max-width:520px}
.hide .ui{display:none!important}
</style></head><body><div id="root"></div>
<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p))a.startsWith('on')?e.addEventListener(a.slice(2),v):a==='class'?e.className=v:e[a]=v;e.append(...k);return e};
const store={get(k,d){try{const v=localStorage.getItem('txqr.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('txqr.'+k,JSON.stringify(v))}catch{}}};
const rid=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>x.toString(16).padStart(2,'0')).join('');
const DID=store.get('did',null)||(()=>{const i=rid(8);store.set('did',i);return i})();
const fmt=d=>d?Number(d).toLocaleString('vi-VN'):'';
const ERR={TXQR_E001:'Mã ghép nối không hợp lệ hoặc bị thiếu. Hãy sao chép/dán lại đầy đủ.',TXQR_E002:'Mã ghép nối đã hết hạn. Hãy tạo mã mới.',TXQR_E005:'Dữ liệu tài khoản không hợp lệ (BIN 6 số, số tài khoản).',TXQR_E007:'Trình duyệt không hỗ trợ WebRTC.',TXQR_E008:'Thiết bị đang cùng mạng nhưng mạng Wi-Fi đang chặn kết nối giữa các thiết bị. Hãy dùng Wi-Fi chính (không phải mạng khách), tắt AP isolation hoặc thử Personal Hotspot.',TXQR_E009:'Nội dung QR quá dài.'};
const fail=c=>{throw Object.assign(new Error(c),{code:c})};
const errText=e=>ERR[e.code]||'Lỗi: '+e.message;

/* ---------- VietQRCore ---------- */
const VietQR=(()=>{
 const tlv=(i,v)=>i+String(v.length).padStart(2,'0')+v;
 const crc16=s=>{let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};
 const clean=(s,n=50)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 \-]/g,'').replace(/\s+/g,' ').trim().toUpperCase().slice(0,n);
 const build=({bin,accountNumber,amount,description})=>{
  const b=String(bin||'').replace(/\D/g,''),acc=String(accountNumber||'').replace(/\s/g,''),amt=String(amount||'').replace(/\D/g,'').replace(/^0+/,''),d=clean(description);
  if(!/^\d{6}$/.test(b)||!acc)fail('TXQR_E005');
  const body=tlv('00','01')+tlv('01',amt?'12':'11')+tlv('38',tlv('00','A000000727')+tlv('01',tlv('00',b)+tlv('01',acc))+tlv('02','QRIBFTTA'))+tlv('53','704')+(amt?tlv('54',amt):'')+tlv('58','VN')+(d?tlv('62',tlv('08',d)):'')+'6304';
  const crc=crc16(body);return{payload:body+crc,crc,normalized:{bin:b,account:acc,amount:amt,description:d}}};
 return{build,crc:crc16,clean}})();

/* ---------- QRCodeCore (byte mode, ECC M then L, versions 1-12) ---------- */
const QRCodeCore=(()=>{
 const ECC={L:{f:1,cw:[7,10,15,20,26,18,20,24,30,18,20,24],bl:[1,1,1,1,1,2,2,2,2,4,4,4]},M:{f:0,cw:[10,16,26,18,24,16,18,22,22,26,30,22],bl:[1,1,1,2,2,4,4,4,5,5,5,8]}};
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=(v/7|0)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
 const align=v=>{if(v===1)return[];const n=(v/7|0)+2,st=Math.ceil((v*4+4)/(n*2-2))*2,r=[6];for(let p=v*4+10;r.length<n;p-=st)r.splice(1,0,p);return r};
 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
 const rsDiv=d=>{const r=Array(d).fill(0);r[d-1]=1;let k=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],k);if(j+1<d)r[j]^=r[j+1]}k=mul(k,2)}return r};
 const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
 const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>((x/3|0)+(y/2|0))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
 const pen=g=>{const N=g.length;let p=0,dark=0;
  for(let a=0;a<N;a++)for(let d=0;d<2;d++){let run=1;for(let b=1;b<N;b++){const c=d?g[b][a]:g[a][b],q=d?g[b-1][a]:g[a][b-1];if(c===q){run++;if(run===5)p+=3;else if(run>5)p++}else run=1}}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(g[y][x])dark++;if(x<N-1&&y<N-1&&g[y][x]===g[y][x+1]&&g[y][x]===g[y+1][x]&&g[y][x]===g[y+1][x+1])p+=3}
  return p+Math.max(0,Math.ceil(Math.abs(dark*20-N*N*10)/(N*N))-1)*10};
 const encode=text=>{const data=new TextEncoder().encode(text);
  for(const e of['M','L'])for(let v=1;v<=12;v++){
   const E=ECC[e],R=raw(v),nb=E.bl[v-1],ec=E.cw[v-1],cap=(R>>3)-nb*ec;
   if(4+(v<10?8:16)+data.length*8>cap*8)continue;
   const bits=[],put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
   put(4,4);put(data.length,v<10?8:16);data.forEach(b=>put(b,8));put(0,Math.min(4,cap*8-bits.length));while(bits.length%8)bits.push(0);
   for(let p=0xEC;bits.length<cap*8;p^=0xFD)put(p,8);
   const cw=[];for(let i=0;i<bits.length;i+=8)cw.push(parseInt(bits.slice(i,i+8).join(''),2));
   const ns=nb-(R>>3)%nb,sl=((R>>3)/nb|0)-ec,div=rsDiv(ec),blocks=[];
   for(let i=0,k=0;i<nb;i++){const d=cw.slice(k,k+sl+(i<ns?0:1));k+=d.length;const r=rsRem(d,div);if(i<ns)d.push(0);blocks.push(d.concat(r))}
   const out=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl||j>=ns)out.push(b[i])});
   const N=v*4+17,m=Array.from({length:N},()=>Array(N).fill(false)),fn=Array.from({length:N},()=>Array(N).fill(false));
   const set=(x,y,d)=>{m[y][x]=d;fn[y][x]=true};
   for(let i=0;i<N;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
   for(const[cx,cy]of[[3,3],[N-4,3],[3,N-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<N&&y>=0&&y<N)set(x,y,d!==2&&d!==4)}
   const ap=align(v),L=ap.length-1;
   ap.forEach((a,i)=>ap.forEach((b,j)=>{if(!((i===0&&j===0)||(i===0&&j===L)||(i===L&&j===0)))for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
   const fmtBits=k=>{const d=(E.f<<3)|k;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(N-1-i,8,g(i));for(let i=8;i<15;i++)set(8,N-15+i,g(i));set(8,N-8,true)};
   fmtBits(0);
   if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const x=N-11+i%3,y=i/3|0,bit=((b>>>i)&1)===1;set(x,y,bit);set(y,x,bit)}}
   let bi=0;for(let r=N-1;r>=1;r-=2){if(r===6)r=5;for(let t=0;t<N;t++)for(let j=0;j<2;j++){const x=r-j,y=((r+1)&2)===0?N-1-t:t;if(!fn[y][x]&&bi<out.length*8){m[y][x]=((out[bi>>>3]>>>(7-(bi&7)))&1)===1;bi++}}}
   const xor=k=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!fn[y][x]&&MF[k](x,y))m[y][x]=!m[y][x]};
   let best=0,bp=1e9;for(let k=0;k<8;k++){xor(k);fmtBits(k);const p=pen(m);if(p<bp){bp=p;best=k}xor(k)}
   xor(best);fmtBits(best);
   return{version:v,size:N,modules:m,mask:best,errorCorrection:e}}
  fail('TXQR_E009')};
 return{encode}})();

/* ---------- QR renderer (sharp integer modules, quiet zone 4) ---------- */
const draw=(cv,mod,px)=>{const n=mod.length,q=4,t=n+2*q,dpr=Math.min(devicePixelRatio||1,3),s=Math.max(1,Math.floor(px*dpr/t)),side=s*t;
 cv.width=cv.height=side;cv.style.width=cv.style.height=side/dpr+'px';const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,side,side);c.fillStyle='#000';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(mod[y][x])c.fillRect((x+q)*s,(y+q)*s,s,s)};
const showQR=(cv,box,s,px,full)=>{box.replaceChildren();if(!s){cv.hidden=true;box.textContent='Chưa có dữ liệu';return}
 try{const r=VietQR.build(s),q=QRCodeCore.encode(r.payload),n=r.normalized;cv.hidden=false;draw(cv,q.modules,px);
  box.append(h('div',{},s.bankName+(full?' — '+n.account:'')),h('div',{},VietQR.clean(s.accountName)),h('div',{class:'amt'},n.amount?fmt(n.amount)+' ₫':'Khách tự nhập số tiền'),h('div',{},n.description))}
 catch(e){cv.hidden=true;box.textContent=errText(e)}};

/* ---------- pairing + protocol ---------- */
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const pipe=async(u,S)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(S)).arrayBuffer());
const pack=async o=>{const u=new TextEncoder().encode(JSON.stringify({protocol:'TXQR-LAN',version:2,...o}));
 return window.CompressionStream?'TXQR2.z.'+b64(await pipe(u,new CompressionStream('deflate'))):'TXQR2.r.'+b64(u)};
const unpack=async(text,type)=>{try{const[a,m,d]=String(text).replace(/\s+/g,'').split('.');if(a!=='TXQR2'||!d)fail('TXQR_E001');
 let u=unb64(d);if(m==='z')u=await pipe(u,new DecompressionStream('deflate'));
 const o=JSON.parse(new TextDecoder().decode(u));
 if(o.protocol!=='TXQR-LAN'||o.version!==2||o.t!==type||!o.sdp||!o.sid)fail('TXQR_E001');
 if(Date.now()>o.exp)fail('TXQR_E002');return o}catch(e){throw e.code?e:Object.assign(new Error('TXQR_E001'),{code:'TXQR_E001'})}};
const rtc=()=>{if(!window.RTCPeerConnection)fail('TXQR_E007');return new RTCPeerConnection({iceServers:[]})};
const iceDone=(pc,ms=12000)=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r(true);const t=setTimeout(()=>r(false),ms);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r(true)}})});
const frame=(type,sid,payload={},sequence=0)=>JSON.stringify({protocol:'TXQR-LAN',version:2,type,sessionId:sid,deviceId:DID,sequence,timestamp:Date.now(),payload});
const unframe=(t,sid)=>{if(typeof t!=='string'||t.length>16384)return null;try{const m=JSON.parse(t);return m&&m.protocol==='TXQR-LAN'&&m.version===2&&m.sessionId===sid?m:null}catch{return null}};
const candType=async pc=>{let r='?';(await pc.getStats()).forEach((x,_,m)=>{if(x.type==='candidate-pair'&&x.nominated&&x.state==='succeeded')r=(m.get(x.localCandidateId)||{}).candidateType||r});return r};
const copy=t=>navigator.clipboard?navigator.clipboard.writeText(t).catch(()=>{}):0;
const share=t=>navigator.share?navigator.share({text:t}).catch(()=>{}):copy(t);
const tools=ta=>h('div',{class:'row'},h('button',{class:'s',onclick:()=>copy(ta.value)},'Sao chép'),h('button',{class:'s',onclick:()=>share(ta.value)},'Chia sẻ'));
const diag=extra=>{const box=h('pre',{style:'font-size:12px;white-space:pre-wrap'}),d=h('details',{class:'card ui'},h('summary',{},'Diagnostics'),box);
 const tick=()=>{box.textContent=[['Internet (navigator.onLine)',navigator.onLine],['Secure context',isSecureContext],['WebRTC',!!window.RTCPeerConnection],['crypto.subtle',!!(crypto&&crypto.subtle)],['BarcodeDetector',!!window.BarcodeDetector],['Service Worker active',!!(navigator.serviceWorker&&navigator.serviceWorker.controller)],['Wake Lock',!!navigator.wakeLock],['CRC16 self-test (29B1)',VietQR.crc('123456789')==='29B1'],...(extra?extra():[])].map(([k,v])=>k+': '+(v===true?'YES':v===false?'NO':v)).join('\n')};
 d.addEventListener('toggle',tick);setInterval(()=>d.open&&tick(),2000);return d};

/* ---------- CONTROL ---------- */
const control=root=>{
 let accs=store.get('accs',[]),sel=(accs.find(a=>a.isDefault)||accs[0]||{}).id,amount=store.get('amt',''),desc=store.get('desc','Thanh Taxi Xanh'),seq=0,tm;
 const peers=[],persist=()=>{store.set('accs',accs)};
 const cur=()=>{const a=accs.find(x=>x.id===sel);return a?{bankName:a.bankName,bin:a.bin,accountNumber:a.accountNumber,accountName:a.accountName,amount,description:desc}:null};
 const stEl=h('span',{class:'pill'},'Chưa kết nối Display'),blockEl=h('p',{class:'msg'}),msgEl=h('p',{class:'msg'}),cv=h('canvas'),box=h('div'),list=h('div'),pairBox=h('div');
 const send=(p,t,pl,sq)=>{if(p.dc.readyState==='open')try{p.dc.send(frame(t,p.sid,pl,sq))}catch{}};
 const sync=d=>{clearTimeout(tm);tm=setTimeout(()=>{const s=cur();if(!s)return;seq++;peers.forEach(p=>send(p,'STATE',{state:s},seq))},d)};
 const label={pairing:'ĐANG GHÉP',connected:'CONNECTED',unstable:'UNSTABLE',disconnected:'DISCONNECTED',blocked:'BỊ CHẶN'};
 const paint=()=>{list.replaceChildren(...peers.map(p=>h('div',{class:'row'},h('span',{},p.name+(p.cand&&p.cand!=='?'?' ('+p.cand+')':'')),h('span',{class:'pill '+(p.status==='connected'?'ok':p.status==='pairing'?'':'bad')},label[p.status]),h('button',{class:'s',onclick:()=>{p.dead=true;try{p.pc.close()}catch{}peers.splice(peers.indexOf(p),1);paint()}},'Xoá'))));
  const n=peers.filter(p=>p.status==='connected').length;stEl.textContent=n?'LAN CONNECTED — '+n+' display (không cần Internet)':'Chưa kết nối Display';stEl.className='pill '+(n?'ok':'');
  blockEl.textContent=peers.some(p=>p.status==='blocked')?ERR.TXQR_E008:''};
 const wire=p=>{const{pc,dc}=p,cand=()=>candType(pc).then(c=>{p.cand=c;paint()}).catch(()=>{});
  pc.oniceconnectionstatechange=()=>{const s=pc.iceConnectionState;if(s==='failed')p.status='blocked';else if(s==='disconnected'&&p.status==='connected')p.status='unstable';else if((s==='connected'||s==='completed')&&dc.readyState==='open')p.status='connected';paint()};
  dc.onopen=()=>{p.status='connected';p.lastSeen=Date.now();send(p,'HELLO',{name:'Control'});const s=cur();if(s)send(p,'STATE',{state:s},seq);cand();paint()};
  dc.onclose=()=>{if(!p.dead){p.status='disconnected';paint()}};
  dc.onmessage=e=>{const m=unframe(e.data,p.sid);if(!m)return;p.lastSeen=Date.now();if(['unstable','disconnected'].includes(p.status)&&dc.readyState==='open')p.status='connected';
   if(m.type==='HELLO_ACK'&&m.payload&&m.payload.name)p.name=String(m.payload.name).slice(0,40);
   else if(m.type==='RESYNC_REQUEST'){const s=cur();if(s)send(p,'STATE',{state:s},seq)}paint()}};
 const addPeer=async()=>{const pc=rtc(),dc=pc.createDataChannel('vietqr-control',{ordered:true}),p={sid:rid(16),pc,dc,name:'Display '+(peers.length+1),status:'pairing',lastSeen:0};
  peers.push(p);wire(p);await pc.setLocalDescription(await pc.createOffer());p.warn=!await iceDone(pc);
  p.offer=await pack({t:'offer',sid:p.sid,did:DID,name:'Control',sdp:pc.localDescription.sdp,exp:Date.now()+6e5});paint();return p};
 const add=async()=>{try{const p=await addPeer(),off=h('textarea',{readOnly:true,value:p.offer}),ans=h('textarea',{placeholder:'Dán Answer từ Display vào đây'}),e=h('p',{class:'msg'});
  pairBox.replaceChildren(h('p',{},'1) Trên Display mở trang này → chọn Display → dán Offer này:'),off,tools(off),p.warn?h('p',{class:'msg'},'ICE chưa thu thập xong (timeout) — kết nối có thể kém.'):h('span'),h('p',{},'2) Dán Answer mà Display tạo ra:'),ans,
   h('button',{onclick:async()=>{try{const a=await unpack(ans.value,'answer');if(a.sid!==p.sid)fail('TXQR_E001');await p.pc.setRemoteDescription({type:'answer',sdp:a.sdp});p.name=String(a.name||p.name).slice(0,40);pairBox.replaceChildren();paint()}catch(x){e.textContent=errText(x)}}},'Kết nối'),e)}
  catch(x){blockEl.textContent=errText(x)}};
 setInterval(()=>{const now=Date.now();for(const p of peers){if(p.dc.readyState!=='open')continue;send(p,'PING');const idle=now-p.lastSeen;if(idle>30000)p.status='disconnected';else if(idle>16000)p.status='unstable'}paint()},8000);
 addEventListener('pagehide',()=>peers.forEach(p=>{try{p.pc.close()}catch{}}));
 /* accounts */
 const selEl=h('select',{'aria-label':'Tài khoản',onchange:e=>{sel=e.target.value;refresh();sync(0)}});
 const fld=(ph,k)=>h('input',{placeholder:ph,name:k,autocomplete:'off','aria-label':ph}),f={bankName:fld('Ngân hàng (vd: MBBank)','bankName'),bin:fld('BIN ngân hàng (6 số)','bin'),accountNumber:fld('Số tài khoản','accountNumber'),accountName:fld('Tên chủ tài khoản','accountName')};
 f.bin.inputMode=f.accountNumber.inputMode='numeric';
 const save=()=>{const v=Object.fromEntries(Object.entries(f).map(([k,e])=>[k,e.value.trim()]));v.accountNumber=v.accountNumber.replace(/\s/g,'');
  if(!v.bankName||!/^\d{6}$/.test(v.bin)||!/^\d{4,19}$/.test(v.accountNumber))return void(msgEl.textContent='Kiểm tra lại tên ngân hàng, BIN (6 số) và số tài khoản.');
  v.accountName=VietQR.clean(v.accountName,40);const a={id:rid(6),...v,isDefault:!accs.length,createdAt:Date.now(),updatedAt:Date.now()};accs.push(a);sel=a.id;persist();Object.values(f).forEach(e=>e.value='');msgEl.textContent='';refresh();sync(0)};
 const setDef=()=>{accs.forEach(a=>a.isDefault=a.id===sel);persist();refresh()};
 const del=()=>{accs=accs.filter(a=>a.id!==sel);if(accs.length&&!accs.some(a=>a.isDefault))accs[0].isDefault=true;sel=(accs.find(a=>a.isDefault)||{}).id;persist();refresh();sync(0)};
 const refresh=()=>{selEl.replaceChildren(...accs.map(a=>h('option',{value:a.id,selected:a.id===sel},a.bankName+' ····'+a.accountNumber.slice(-4)+(a.isDefault?' ★':''))));if(sel)selEl.value=sel;showQR(cv,box,cur(),Math.min(innerWidth-80,360),true)};
 const amtEl=h('input',{inputMode:'numeric',placeholder:'Số tiền (VND) — để trống nếu không cố định','aria-label':'Số tiền',value:fmt(amount),oninput:e=>{amount=e.target.value.replace(/\D/g,'').slice(0,12);e.target.value=fmt(amount);store.set('amt',amount);refresh();sync(100)}});
 const descEl=h('input',{maxLength:80,placeholder:'Nội dung chuyển khoản','aria-label':'Nội dung',value:desc,oninput:e=>{desc=e.target.value;store.set('desc',desc);refresh();sync(150)}});
 root.append(h('div',{class:'w'},
  h('div',{class:'card'},h('h1',{},'Thanh Taxi Xanh'),stEl,blockEl),
  h('div',{class:'card'},h('h2',{},'Tài khoản'),selEl,h('div',{class:'row'},h('button',{class:'s',onclick:setDef},'Đặt mặc định'),h('button',{class:'s',onclick:del},'Xoá')),h('details',{},h('summary',{},'+ Thêm tài khoản'),...Object.values(f),h('button',{onclick:save},'Lưu tài khoản'),msgEl)),
  h('div',{class:'card'},h('h2',{},'Số tiền và nội dung'),amtEl,descEl),
  h('div',{class:'card qr'},cv,box),
  h('div',{class:'card'},h('h2',{},'Display'),list,h('button',{onclick:add},'+ Add Display'),pairBox),
  diag(()=>peers.map(p=>[p.name,[p.pc.iceConnectionState,p.dc.readyState,p.cand||'-'].join(' / ')+(p.cand==='relay'?' ⚠ Unexpected relay candidate — LAN-only mode should not use Internet relay.':'')]))));
 refresh();paint()};

/* ---------- DISPLAY ---------- */
const display=root=>{
 const devName='Display '+DID.slice(0,4),sane=s=>({bankName:String(s.bankName||'').slice(0,40),bin:String(s.bin||'').slice(0,6),accountNumber:String(s.accountNumber||'').slice(0,19),accountName:String(s.accountName||'').slice(0,40),amount:String(s.amount||'').replace(/\D/g,'').slice(0,12),description:String(s.description||'').slice(0,80)});
 let st=store.get('last',null),lastAt=store.get('lastAt',0),conn='boot',seq=-1,pc=null,sid=null,wl=null;
 const cv=h('canvas'),box=h('div',{class:'ui'}),badge=h('div',{class:'pill ui'}),blockEl=h('p',{class:'msg ui'}),err=h('p',{class:'msg'});
 const hhmm=t=>new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
 const paint=()=>{showQR(cv,box,st,Math.floor(Math.min(innerWidth*.9,innerHeight*.6)),false);
  badge.textContent=conn==='connected'?'LAN CONNECTED — không cần Internet':conn==='boot'?'Thanh Taxi Xanh — Waiting for Control…':'OFFLINE — Last updated '+(lastAt?hhmm(lastAt):'—');badge.className='pill ui '+(conn==='connected'?'ok':conn==='boot'?'':'bad')};
 const wake=async()=>{try{wl=navigator.wakeLock?await navigator.wakeLock.request('screen'):null}catch{}};
 const bind=dc=>{const tx=(t,pl,sq)=>{try{dc.send(frame(t,sid,pl,sq))}catch{}};
  dc.onopen=()=>{conn='connected';seq=-1;blockEl.textContent='';paint();wake()};
  dc.onclose=()=>{conn='disconnected';paint()};
  dc.onmessage=e=>{const m=unframe(e.data,sid);if(!m)return;
   if(m.type==='HELLO')tx('HELLO_ACK',{name:devName});
   else if(m.type==='PING')tx('PONG');
   else if(m.type==='STATE'&&Number.isInteger(m.sequence)&&m.sequence>seq&&m.payload&&m.payload.state&&typeof m.payload.state==='object'){seq=m.sequence;st=sane(m.payload.state);lastAt=Date.now();store.set('last',st);store.set('lastAt',lastAt);paint();tx('STATE_ACK',{},seq)}}};
 const pair=async text=>{const o=await unpack(text,'offer');if(pc)pc.close();pc=rtc();sid=o.sid;seq=-1;pc.ondatachannel=e=>bind(e.channel);
  pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='failed'){conn='disconnected';blockEl.textContent=ERR.TXQR_E008;paint()}};
  await pc.setRemoteDescription({type:'offer',sdp:o.sdp});await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
  return pack({t:'answer',sid,did:DID,name:devName,sdp:pc.localDescription.sdp,exp:Date.now()+6e5})};
 const offIn=h('textarea',{placeholder:'Dán Offer từ Control','aria-label':'Offer'}),ansOut=h('textarea',{readOnly:true,'aria-label':'Answer'});
 const stage=h('div',{id:'stage'},h('div',{style:'width:100%;display:grid;gap:10px;justify-items:center'},
  h('h1',{class:'ui'},'Thanh Taxi Xanh'),cv,box,badge,blockEl,
  h('div',{class:'row ui',style:'width:100%;max-width:520px'},
   h('button',{class:'s',onclick:()=>{const d=document.documentElement;d.requestFullscreen?d.requestFullscreen().catch(()=>{}):0;wake()}},'Toàn màn hình'),
   h('button',{class:'s',onclick:e=>{e.stopPropagation();stage.classList.add('hide')}},'Ẩn giao diện')),
  h('div',{class:'card ui',style:'width:100%'},h('h2',{},'Ghép nối với Control'),offIn,
   h('button',{onclick:async()=>{err.textContent='';ansOut.value='';try{ansOut.value=await pair(offIn.value)}catch(x){err.textContent=errText(x)}}},'Tạo Answer'),
   h('p',{},'Đưa Answer này sang Control:'),ansOut,tools(ansOut),err),
  diag(()=>[['Display state',conn],['ICE connection',pc?pc.iceConnectionState:'-'],['ICE gathering',pc?pc.iceGatheringState:'-'],['Last sequence',seq]])));
 stage.addEventListener('click',()=>stage.classList.remove('hide'));
 document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&conn==='connected'&&wake());
 addEventListener('resize',paint);addEventListener('pagehide',()=>pc&&pc.close());
 root.append(stage);paint()};

/* ---------- landing + router ---------- */
const landing=root=>root.append(h('div',{class:'w'},h('div',{class:'card'},h('h1',{},'Thanh Taxi Xanh — VietQR LAN Display'),h('p',{},'Chọn vai trò cho thiết bị này:'),
 h('button',{onclick:()=>{location.hash='control'}},'Control (điện thoại điều khiển)'),h('button',{class:'s',onclick:()=>{location.hash='display'}},'Display (TV / iPad)')),diag()));
addEventListener('hashchange',()=>location.reload());
({control,display}[location.hash.slice(1)]||landing)(document.getElementById('root'));
if(isSecureContext&&navigator.serviceWorker)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
})();
</script></body></html>
